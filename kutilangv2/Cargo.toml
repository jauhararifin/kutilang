[package]
name = "kutilangv2"
version = "2.0.0"
edition = "2024"
description = "Kutilang medical records, rewritten in Rust with GPUI"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "6.0.0"
gpui-kit = "0.9.0"
# Same versions as gpui-base uses, so they are compiled once.
html5ever = "0.27"
markdown = "1.0.0"
markup5ever_rcdom = "0.3.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
# `test-support` provides `Window::render_to_image`, used by examples/screenshot.rs.
gpui-kit = { version = "0.9.0", features = ["test-support"] }
# test-support pulls in proptest; 1.12 needs a rand_xorshift that is only a
# pre-release on crates.io, so the resolver must stay on 1.11.
proptest = "<1.12"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
